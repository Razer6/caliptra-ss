[package]
name = "caliptra-rom-patch"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Caliptra MCU ROM patch packer (RFC-0001 / caliptra-ss#1163): PMP trap-and-patch signed-block generator"
license = "Apache-2.0"

[lib]
name = "caliptra_rom_patch"
path = "src/lib.rs"

[[bin]]
name = "caliptra-rom-patch"
path = "src/bin/caliptra-rom-patch.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
deser-hjson = "1"
ed25519-dalek = "2"
env_logger = "0.11"
goblin = "0.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
